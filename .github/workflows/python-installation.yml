name: Installing Python

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        py-version:
          - 3.12
          - 3.13
          - 3.14
        os:
          - ubuntu-latest
          - macos-14
          - windows-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.py-version }}

